services:
  albumfixer:
    build: .
    ports: ["8080:8080"]
    volumes:
      - /srv/nzb/complete:/nzb
      - /srv/flac/ingest:/flac/ingest
      - ./discogs:/opt/discogs:ro   # checkout of the discogs repo (nzbfix.py, fixtags.py, ...)
      - ./data:/data               # settings.json (includes API keys) and generated config overlay
